name: Validate Apache Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Strict signed RC validation or unsigned source prevalidation
        type: choice
        options: [rc, source-prevalidation]
        default: rc
      release_version:
        description: Package and Maven release version
        default: '1.8.0'
        required: true
      svn_path:
        description: Path below dev/hugegraph, e.g. 1.8.0/RC1 (defaults to version)
      gpg_user:
        description: Release signer's name or public key fingerprint
        default: pengjunzhi
        required: true
      staging_repository:
        description: Apache Maven staging repository URL
        default: https://repository.apache.org/content/groups/staging/
        required: true
      server_sha:
        description: Full Server commit SHA (source prevalidation only)
      toolchain_sha:
        description: Full Toolchain commit SHA (source prevalidation only)
      all_platforms:
        description: Run source prevalidation on all four platforms (RC always does)
        type: boolean
        default: false
  push:
    branches: ['release-*']
  pull_request:
    branches: ['release-*']

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.platforms.outputs.value }}
      version: ${{ steps.platforms.outputs.version }}
    steps:
      - id: platforms
        env:
          MODE: ${{ inputs.mode || 'rc' }}
          ALL_PLATFORMS: ${{ inputs.all_platforms }}
          INPUT_VERSION: ${{ inputs.release_version }}
          RELEASE_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          version="${INPUT_VERSION:-${RELEASE_BRANCH#release-}}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release version: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$MODE" == source-prevalidation && "$ALL_PLATFORMS" != true ]]; then
            echo 'value=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'value=["ubuntu-latest","ubuntu-24.04-arm","macos-latest","macos-14"]' >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: prepare
    name: Validate on ${{ matrix.os }} (Java 17)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      SVN_PATH: ${{ inputs.svn_path }}
      GPG_USER: ${{ inputs.gpg_user || 'pengjunzhi' }}
      STAGING_REPOSITORY: ${{ inputs.staging_repository || 'https://repository.apache.org/content/groups/staging/' }}
      MODE: ${{ inputs.mode || 'rc' }}
      SERVER_SHA: ${{ inputs.server_sha }}
      TOOLCHAIN_SHA: ${{ inputs.toolchain_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Install validation tools
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew install subversion coreutils
            echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          else
            sudo apt-get update
            sudo apt-get install -y subversion gnupg libgomp1
          fi
      - name: Check validator
        run: |
          bash -n dist/validate-release.sh dist/prepare-release.sh
          python3 -m unittest discover -s dist/tests
      - name: Build unsigned packages from exact revisions
        if: env.MODE == 'source-prevalidation'
        shell: bash
        run: |
          bash dist/prepare-release.sh "$RELEASE_VERSION" "$SERVER_SHA" "$TOOLCHAIN_SHA" "$RUNNER_TEMP/prevalidation" 2>&1 | tee "$RUNNER_TEMP/prevalidation-build.log"
      - name: Validate packages
        run: |
          args=(--non-interactive --work-dir "$RUNNER_TEMP/release-validation" --staging-repository "$STAGING_REPOSITORY")
          if [[ "$MODE" == source-prevalidation ]]; then
            args+=(--source-prevalidation --sdk-repository "$RUNNER_TEMP/prevalidation/m2")
            bash dist/validate-release.sh "${args[@]}" "$RELEASE_VERSION" "$GPG_USER" "$RUNNER_TEMP/prevalidation/packages" 17
          else
            args+=(--svn-path "${SVN_PATH:-$RELEASE_VERSION}")
            bash dist/validate-release.sh "${args[@]}" "$RELEASE_VERSION" "$GPG_USER"
          fi
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/release-validation/**/validation.log
            ${{ runner.temp }}/release-validation/**/logs/**
            ${{ runner.temp }}/release-validation/**/backup-*/**
            ${{ runner.temp }}/prevalidation/origin.txt
            ${{ runner.temp }}/prevalidation-build.log
          if-no-files-found: warn
