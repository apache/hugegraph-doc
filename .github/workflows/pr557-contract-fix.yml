name: "PR 557 deterministic contract fix"

"on":
  push:
    branches:
      - refactor/unify-clients-nav

permissions:
  contents: write

jobs:
  fix-contracts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and validate deterministic fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/.pr557_fix.py
          python3 -m json.tool data/version_routes.json >/dev/null
          python3 -m json.tool data/docs_nav.json >/dev/null
          git diff --check

      - name: Commit to a protected-branch fix PR
        shell: bash
        run: |
          set -euo pipefail
          target=codex/pr557-contract-fix-20261102
          if git ls-remote --exit-code --heads origin "refs/heads/${target}"; then
            echo "Refusing to overwrite existing ${target}" >&2
            exit 1
          fi
          rm scripts/.pr557_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: align SDK and Vermeer contracts"
          git push origin "HEAD:refs/heads/${target}"
