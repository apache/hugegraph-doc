title: &siteTitle Apache HugeGraph
baseURL: https://hugegraph.apache.org/
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
enableGitInfo: true
enableMissingTranslationPlaceholders: true
enableRobotsTXT: true
enableEmoji: true

languages:
  en:
    label: English
    locale: en-US
    contentDir: content/en
    weight: 1
    title: *siteTitle
    params:
      description: Apache HugeGraph documentation and project updates.
      version_menu: Releases
    menus:
      main:
        - { identifier: docs, name: Documentation, pageRef: /docs, weight: 10 }
        - { identifier: docs-start, parent: docs, name: Get Started, pageRef: /docs/quickstart, weight: 11, params: { icon: 'fa-solid fa-rocket' } }
        - { identifier: docs-components, parent: docs, name: Components, pageRef: /docs/quickstart/hugegraph, weight: 12, params: { icon: 'fa-solid fa-cubes' } }
        - { identifier: docs-develop, parent: docs, name: Develop, pageRef: /docs/clients, weight: 13, params: { icon: 'fa-solid fa-code' } }
        - { identifier: docs-operate, parent: docs, name: Operate, pageRef: /docs/config, weight: 14, params: { icon: 'fa-solid fa-screwdriver-wrench' } }
        - { identifier: docs-reference, parent: docs, name: Reference, pageRef: /docs/changelog, weight: 15, params: { icon: 'fa-solid fa-book-open' } }
        - { identifier: download, name: Download, pageRef: /docs/download/download, weight: 20 }
        - { identifier: blog, name: Blog, pageRef: /blog, weight: 30 }
        - { identifier: community, name: Community, pageRef: /community, weight: 40 }
        - { identifier: github, name: GitHub, url: 'https://github.com/apache/hugegraph', weight: 50 }
  cn:
    label: 简体中文
    locale: zh-CN
    contentDir: content/cn
    hasCJKLanguage: true
    weight: 2
    title: *siteTitle
    params:
      description: Apache HugeGraph 中文文档与项目动态。
      version_menu: 版本
    menus:
      main:
        - { identifier: docs, name: 文档, pageRef: /docs, weight: 10 }
        - { identifier: docs-start, parent: docs, name: 开始, pageRef: /docs/quickstart, weight: 11, params: { icon: 'fa-solid fa-rocket' } }
        - { identifier: docs-components, parent: docs, name: 组件, pageRef: /docs/quickstart/hugegraph, weight: 12, params: { icon: 'fa-solid fa-cubes' } }
        - { identifier: docs-develop, parent: docs, name: 开发, pageRef: /docs/clients, weight: 13, params: { icon: 'fa-solid fa-code' } }
        - { identifier: docs-operate, parent: docs, name: 配置, pageRef: /docs/config, weight: 14, params: { icon: 'fa-solid fa-screwdriver-wrench' } }
        - { identifier: docs-reference, parent: docs, name: 参考, pageRef: /docs/changelog, weight: 15, params: { icon: 'fa-solid fa-book-open' } }
        - { identifier: download, name: 下载, pageRef: /docs/download/download, weight: 20 }
        - { identifier: blog, name: 博客, pageRef: /blog, weight: 30 }
        - { identifier: community, name: 社区, pageRef: /community, weight: 40 }
        - { identifier: github, name: GitHub, url: 'https://github.com/apache/hugegraph', weight: 50 }

taxonomies:
  tag: tags
  category: categories
  series: series

permalinks:
  blog: /:section/:year/:month/:day/:slug/

imaging:
  resampleFilter: CatmullRom
  anchor: Smart
  jpeg:
    quality: 75
  webp:
    quality: 75
  avif:
    quality: 75

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    lineNos: true
    guessSyntax: true
    lineNumbersInTable: false
    noClasses: false
    style: tango

outputs:
  home: [HTML, RSS, markdown, LLMS, NAVJSON]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

params:
  # Native module outlines load the local runtime only on pages with Markmap.
  markmap: true
  description: Apache HugeGraph is a full-stack graph database ecosystem for OLTP, OLAP, and graph AI.
  images: [/img/social/hugegraph-apache.png]
  github_repo: https://github.com/apache/hugegraph-doc
  github_project_repo: https://github.com/apache/hugegraph
  github_branch: master
  logo: img/logo.svg
  # Visible navigation lockup; keep the longer site title for metadata/SEO.
  brand_name: HugeGraph
  version: latest
  # Historical entries are enabled only after the aggregate artifact exists.
  version_menu_pagelinks: false
  archived_version: false
  url_latest_version: https://hugegraph.apache.org/docs/
  offline_search: true
  offline_search_on_serve: true
  # Include body-only configuration names and error messages in local search.
  offline_search_index: content
  offline_search_summary_length: 70
  offline_search_max_results: 10
  # Consent-gated Kapa; set false to disable. Rollout evidence and source
  # readiness are tracked in scripts/kapa-rollout.md and issue #495.
  ai_search:
    enabled: true
    provider: kapa
    website_id: 0b277570-4740-451e-96fa-1e4ac1ac5e88
    # Each version has independent language groups; absent versions show a local availability notice.
    source_groups:
      latest:
        en: 32769e2a-abfc-42f6-891f-09af6c123eb2
        cn: ddce6795-32c8-40ac-8b27-73d73facd042
      '1.7':
        en: 01c70391-63ab-40bb-b043-ca38f6549fd2
        cn: 16ffb5cd-1502-4e5b-bcbb-d4df0eb75505
      '1.5':
        en: afcbb285-13d8-4668-bac3-93f559389a5f
        cn: 48626579-051f-49a1-a16e-5bf2cabc59d0
  footer_center_info: ''
  # The compact ASF footer owns the legal line; global controls stay in header.
  copyright: false
  print:
    toc: true
  ui:
    # Keep Slate by default; explicitly opt in to all four native styles.
    preset: slate
    preset_menu: [paper, slate, ink, terminal]
    theme_color: '#532fc9'
    dark_mode:
      enable: true
      show_menu: true
    footer_style: fat
    section_index: cards
    blog_index: cards
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_expand_levels: 2
    wide_nav_sections: [community]
    sidebar_icon_policy: all
    sidebar_item_overflow: wrap
    backlinks: true
    image_zoom: true
    page_context_menu:
      enable: true
      assistant_links: false
    reading_time: false
    feedback: false
    keyboard_nav: true

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.168.0
