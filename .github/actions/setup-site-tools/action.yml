name: Setup site compilers
description: Install pinned Hugo Extended with its built-in LibSass compiler
inputs:
  hugo-version:
    description: Hugo Extended version
    required: true
runs:
  using: composite
  steps:
    - name: Setup Hugo Extended
      uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
      with:
        hugo-version: ${{ inputs.hugo-version }}
        extended: true
