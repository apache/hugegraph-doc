hero:
  align: center
  class: hg-home-hero
  title: Apache HugeGraph
  lead: HugeGraph 是一套全栈图系统，覆盖 [图数据库](docs/quickstart/hugegraph/hugegraph-server/)、[图计算](docs/quickstart/computing/hugegraph-computer/) 与 [图 AI](docs/quickstart/hugegraph-ai/)。
  note: 支持从数据存储、实时查询到离线分析的完整图数据处理能力，并支持 [Gremlin](docs/language/hugegraph-gremlin/) 与 [Cypher](docs/clients/restful-api/cypher/) 查询语言。
  actions:
    - { label: 了解更多, url: docs/, icon: fa-solid fa-circle-arrow-right, style: primary }
    - { label: 下载, url: docs/download/download/, icon: fa-brands fa-github, style: ghost }

introduction:
  class: hg-home-introduction
  body: |-
    HugeGraph 最高支持千亿级图数据高速导入与毫秒级实时查询，可与 Spark、Flink 等大数据平台深度集成，并可通过 [HugeGraph 工具链](docs/quickstart/toolchain/)快速完成导入、可视化与运维。

    在 AI 时代，通过与大语言模型 (LLM) 结合，为智能问答、推荐系统、风控反欺诈、知识图谱等场景提供强大的图计算能力。

capabilities:
  class: hg-home-capabilities
  columns: 3
  items:
    - title: 易用
      icon: fa-solid fa-lightbulb
      desc: 支持 Gremlin 图查询语言与 [**RESTful API**](docs/clients/restful-api/)，并提供图检索常用接口，具备齐全的周边工具，支持分布式存储、数据多副本及横向扩容，内置多种后端存储引擎，轻松实现各种查询、分析。
    - title: 高效
      icon: fa-solid fa-truck-fast
      desc: 在图存储和图计算方面做了深度优化，提供 [**批量导入工具**](docs/quickstart/toolchain/hugegraph-loader/)，轻松完成百亿级数据快速导入，通过优化过的查询达到图检索的毫秒级响应，支持数千用户并发的在线实时操作。
    - title: 通用
      icon: fa-solid fa-arrow-right-arrow-left
      desc: 支持 Apache Gremlin 标准图查询语言和 Property Graph 标准图建模方法，支持基于图的 OLTP 和 [**OLAP 图计算**](docs/quickstart/computing/hugegraph-computer/)方案。集成 Apache Hadoop 及 Apache Spark 大数据平台，也可插件式轻松扩展后端存储引擎。
    - title: 智能化
      icon: fa-solid fa-brain
      desc: 集成 LLM 实现 [**GraphRAG 能力**](docs/quickstart/hugegraph-ai/)、自动化知识图谱构建，内置 20+ 图机器学习算法，轻松构建 AI 驱动的图应用。
    - title: 可扩展
      icon: fa-solid fa-up-right-and-down-left-from-center
      desc: 支持水平扩容和分布式部署，从单机到 PB 级集群无缝迁移，提供 [**分布式存储引擎**](docs/quickstart/hugegraph/hugegraph-hstore/)适配，满足不同规模和性能需求。
    - title: 开放生态
      icon: fa-solid fa-puzzle-piece
      desc: 遵循 Apache TinkerPop 标准，提供 [**多语言客户端**](docs/quickstart/client/hugegraph-client/)，兼容主流大数据平台，社区活跃持续演进。

