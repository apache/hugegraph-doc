hero:
  title: One graph stack, from database to AI
  body: Query and explore connected data, run graph algorithms, and build GraphRAG applications
  primary:
    label: Get Started
    url: /docs/quickstart/
  secondary:
    label: GitHub
    url: https://github.com/apache/hugegraph
  explore: Explore the layers

layers:
  ai:
    name: Graph AI
    components: llm/sdk/rag
    description: GraphRAG and ontology graph construction with LLMs
    url: /docs/quickstart/hugegraph-ai/
    go: Explore Graph AI
  computing:
    name: Graph Computing
    components: memory + disk
    description: OLAP over the whole graph, in memory or on a BSP cluster
    url: /docs/quickstart/computing/
    go: Explore Graph Computing
  toolchain:
    name: Graph Toolchain
    components: loader/hubble/tools
    description: Import vertices and edges with Loader, explore them in Hubble, and back up or migrate data with Tools
    url: /docs/quickstart/toolchain/
    go: Explore Graph Toolchain
  database:
    name: Graph Database
    components: standalone/distributed
    description: Server handles graph queries. In a distributed deployment, PD manages partitions
      and Store keeps replicas
    url: /docs/quickstart/hugegraph/
    go: Explore Graph Database

story:
  label: HugeGraph, from one stack to every scale
  stack_label: HugeGraph stack, four layers from database to AI
  read_guide: Read the guide
  beats:
    database:
      title: Start with one vertex
      body: Query a vertex and its neighbors. Run the database on one node or deploy Server, PD and Store as a cluster
      url: /docs/quickstart/hugegraph/
      link_label: Explore database deployment
    toolchain:
      title: Import the data. Follow a connection
      body: Load vertices and edges with Loader, then explore the query results in Hubble, one relationship at a time
      url: /docs/quickstart/toolchain/
      link_label: Explore the graph toolchain
    computing:
      title: Analyze the whole graph to discover communities
      body: Graph computing runs OLAP over the whole dataset, with Vermeer in memory and Computer on a BSP cluster
      url: /docs/quickstart/computing/
      link_label: Explore graph computing
    ai:
      title: Explore graphs with AI
      body: GraphRAG retrieves the subgraph that grounds an LLM answer, and the same toolkit builds knowledge graphs
      url: /docs/quickstart/hugegraph-ai/
      link_label: Explore Graph AI
  readouts:
    database: "{vertices} vertices, 1 neighborhood"
    toolchain: Graph exploration · vertices and edges
    computing: "{vertices} vertices, {communities} communities"
    ai: 1 question, 1 retrieved subgraph

statement:
  body: A full-stack graph system that carries your data from **storage** and **real-time querying** to **offline analysis** and **AI**
  figures:
    - value: 100s of billions
      label: vertices and edges
    - value: Milliseconds
      label: latency for optimized queries
    - value: 20+
      label: built-in graph algorithms
    - value: 1st
      label: Apache top‑level graph system

capabilities:
  title: Key features
  items:
    - title: Efficient
      variant: efficient
      body: Batch import for massive datasets, millisecond-level retrieval
        and concurrent online operations for thousands of users
      icon: fa-solid fa-bolt
      url: /docs/quickstart/toolchain/hugegraph-loader/
    - title: AI-Ready
      variant: ai
      body: GraphRAG, automated knowledge graph construction and 20+ built-in graph machine learning algorithms
      icon: fa-solid fa-wand-magic-sparkles
      url: /docs/quickstart/hugegraph-ai/
    - title: Convenient
      body: Gremlin, Cypher and a RESTful API, plus a complete toolchain for import, visualization and operations
      icon: fa-solid fa-terminal
      url: /docs/quickstart/toolchain/
    - title: Adaptable
      body: Property graph modeling on Apache TinkerPop, covering OLTP and OLAP, with Hadoop and Spark integration
      icon: fa-solid fa-puzzle-piece
      url: /docs/quickstart/computing/
    - title: Scalable
      body: Horizontal scaling and distributed deployment, from a standalone server to PB-level clusters
      icon: fa-solid fa-expand
      url: /docs/quickstart/hugegraph/hugegraph-hstore/
    - title: Open Ecosystem
      variant: open
      body: TinkerPop standards, multi-language clients and an active, evolving Apache community
      icon: fa-solid fa-plug
      url: /docs/clients/client/hugegraph-client/

platforms:
  title: Fits the platforms you already run
  pause: Pause logo animation

components:
  title: ALL IN ONE
  body: Deploy the database on one node or across a cluster. Add tools, graph computing and AI as needed
  first_use: Start here
  groups:
    - title: Graph Database
      items:
        - name: Server
          body: Core graph engine with REST API, Gremlin and Cypher
          url: /docs/quickstart/hugegraph/hugegraph-server/
          first_use: true
        - name: PD
          body: Placement Driver for metadata, partitions and cluster scheduling
          url: /docs/quickstart/hugegraph/hugegraph-pd/
        - name: Store
          body: Distributed storage with Raft consensus
          url: /docs/quickstart/hugegraph/hugegraph-hstore/
    - title: Toolchain
      items:
        - name: Hubble
          body: Web platform for graph visualization
          url: /docs/quickstart/toolchain/hugegraph-hubble/
        - name: Loader
          body: Data import tool for bulk loading
          url: /docs/quickstart/toolchain/hugegraph-loader/
        - name: Tools
          body: Command-line utilities for backup, restore and migration
          url: /docs/quickstart/toolchain/hugegraph-tools/
    - title: Computing and AI
      items:
        - name: Vermeer
          body: In-memory graph algorithms for PageRank and community detection
          url: /docs/quickstart/computing/hugegraph-vermeer/
        - name: AI
          body: GraphRAG and knowledge graph construction with LLMs
          url: /docs/quickstart/hugegraph-ai/

quickstart:
  title: Quick start
  body: The Docker image starts HugeGraph Server on port 8080, with RocksDB as the default backend
  command: docker run -itd --name=server -p 127.0.0.1:8080:8080 hugegraph/hugegraph
  copy: Copy
  copied: Copied
  copy_fallback: Copy selected command
  copy_status: Command copied to clipboard
  copy_fallback_status: Command selected; use your system copy command to copy it
  verify: Check the startup logs, then verify the service is ready
  verify_command: curl -fsS http://127.0.0.1:8080/versions
  next:
    label: Verify setup and run your first query
    url: /docs/quickstart/hugegraph/hugegraph-server/
  install:
    label: Other install options
    url: /docs/download/download/

