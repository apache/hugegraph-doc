sections:
  - type: hero
    data:
      eyebrow: Apache HugeGraph
      title: 加入 Apache HugeGraph 社区
      lead: Apache HugeGraph 是一个开放的开源项目，社区中的每个人都可以使用、改进并从中受益。欢迎加入我们，通过以下方式了解项目动态并参与社区。
      actions:
        - { label: 参与贡献, url: /docs/contribution-guidelines/, icon: fa-solid fa-code-pull-request, style: primary }
        - { label: 前往 GitHub, url: 'https://github.com/apache/hugegraph', icon: fa-brands fa-github, external: true, style: ghost }

  - type: cards
    data:
      title: 参与社区
      columns: 2
      items:
        - title: 了解与交流
          icon: fa-solid fa-people-group
          desc: |
            正在使用或准备使用 Apache HugeGraph？可以从这里开始：

            - [项目介绍](/cn/docs/introduction/) — 了解 Apache HugeGraph 及其核心能力。
            - [快速开始](/cn/docs/quickstart/hugegraph/hugegraph-server/) — 通过简单配置开始 HugeGraph 之旅。
            - [下载](/cn/docs/download/download/) — 获取最新的 Apache HugeGraph 版本。
            - [配置文档](/cn/docs/config/) — 根据使用场景配置 HugeGraph。
            - [微信公众号](https://github.com/apache/hugegraph#contact-us) — 关注社区并获取最新动态。
        - title: 开发与贡献
          icon: fa-solid fa-code
          desc: |
            希望更深入地参与 Apache HugeGraph？可以通过以下渠道加入我们：

            - [GitHub](https://github.com/apache/hugegraph) — Apache HugeGraph 的开发在各项目仓库中公开进行。
            - [开发者邮件列表](/cn/docs/contribution-guidelines/subscribe/) — 讨论项目开发和社区事务。
            - [安全邮件列表](mailto:security@hugegraph.apache.org) — 私下报告安全问题。
            - [安全策略](/cn/docs/guides/security/) — 了解项目的安全问题报告流程。
            - [贡献指南](/cn/docs/contribution-guidelines/) — 了解如何贡献代码和文档。

  - type: markdown
    data:
      title: 了解项目运作方式
      body: Apache HugeGraph 使用英文版 [项目成熟度评估](/community/maturity/) 记录社区实践。
