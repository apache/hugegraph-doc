sections:
  - type: hero
    data:
      eyebrow: Apache HugeGraph
      title: Join the Apache HugeGraph community
      lead: Apache HugeGraph is an open source project that anyone in the community can use, improve, and enjoy. We'd love you to join us! Here are a few ways to find out what's happening and get involved.
      actions:
        - { label: Contribute, url: /docs/contribution-guidelines/, icon: fa-solid fa-code-pull-request, style: primary }
        - { label: View on GitHub, url: 'https://github.com/apache/hugegraph', icon: fa-brands fa-github, external: true, style: ghost }

  - type: cards
    data:
      title: Get involved
      columns: 2
      items:
        - title: Learn and connect
          icon: fa-solid fa-people-group
          desc: |
            Using or want to use Apache HugeGraph? Find out more here:

            - [Introduction](/docs/introduction/) — increase your understanding of the project.
            - [Quick start](/docs/quickstart/hugegraph/hugegraph-server/) — begin your HugeGraph journey with a simple setup.
            - [Download](/docs/download/download/) — get the latest Apache HugeGraph release.
            - [Configuration](/docs/config/) — learn how to configure HugeGraph for your use case.
            - [WeChat](https://github.com/apache/hugegraph#community) — follow the community and get the latest news.
        - title: Develop and contribute
          icon: fa-solid fa-code
          desc: |
            Want to get more involved in Apache HugeGraph? Join us here:

            - [GitHub](https://github.com/apache/hugegraph) — development takes place in the Apache HugeGraph repositories.
            - [Developer mailing list](/docs/contribution-guidelines/subscribe/) — discuss project and community topics.
            - [Security mailing list](mailto:security@hugegraph.apache.org) — report security issues privately.
            - [Security policy](/docs/guides/security/) — follow the project's security reporting process.
            - [Contribution guidelines](/docs/contribution-guidelines/) — learn how to contribute code and documentation.

  - type: community-members
    partial: landing/sections/community-members.html
    data:
      id: project-members

  - type: cta
    data:
      title: Learn how the project works
      desc: Review Apache HugeGraph's maturity assessment and community practices.
      actions:
        - { label: Project maturity, url: /community/maturity/, icon: fa-solid fa-list-check, style: primary }
