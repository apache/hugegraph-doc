title: &siteTitle Apache HugeGraph
baseURL: https://hugegraph.apache.org/
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
enableGitInfo: true
enableMissingTranslationPlaceholders: true
enableRobotsTXT: true
enableEmoji: true

languages:
  en:
    label: English
    locale: en-US
    contentDir: content/en
    weight: 1
    title: *siteTitle
    params:
      description: Apache HugeGraph documentation and project updates.
      version_menu: Releases
      versions:
        - { version: latest, name: latest, url: 'https://hugegraph.apache.org/docs/', pagelinks: false }
        - { version: '1.7', name: '1.7', url: 'https://hugegraph.apache.org/versions/1.7/docs/', pagelinks: false }
        - { version: '1.5', name: '1.5', url: 'https://hugegraph.apache.org/versions/1.5/docs/', pagelinks: false }
    menus:
      main:
        - { identifier: docs, name: Documentation, pageRef: /docs, weight: 10 }
        - { identifier: download, name: Download, pageRef: /docs/download/download, weight: 20 }
        - { identifier: blog, name: Blog, pageRef: /blog, weight: 30 }
        - { identifier: community, name: Community, pageRef: /community, weight: 40 }
        - { identifier: github, name: GitHub, url: 'https://github.com/apache/hugegraph', weight: 50 }
  cn:
    label: 简体中文
    locale: zh-CN
    contentDir: content/cn
    hasCJKLanguage: true
    weight: 2
    title: *siteTitle
    params:
      description: Apache HugeGraph 中文文档与项目动态。
      version_menu: 版本
      versions:
        - { version: latest, name: latest, url: 'https://hugegraph.apache.org/cn/docs/', pagelinks: false }
        - { version: '1.7', name: '1.7', url: 'https://hugegraph.apache.org/versions/1.7/cn/docs/', pagelinks: false }
        - { version: '1.5', name: '1.5', url: 'https://hugegraph.apache.org/versions/1.5/cn/docs/', pagelinks: false }
    menus:
      main:
        - { identifier: docs, name: 文档, pageRef: /docs, weight: 10 }
        - { identifier: download, name: 下载, pageRef: /docs/download/download, weight: 20 }
        - { identifier: blog, name: 博客, pageRef: /blog, weight: 30 }
        - { identifier: community, name: 社区, pageRef: /community, weight: 40 }
        - { identifier: github, name: GitHub, url: 'https://github.com/apache/hugegraph', weight: 50 }

taxonomies:
  tag: tags
  category: categories

permalinks:
  blog: /:section/:year/:month/:day/:slug/

imaging:
  resampleFilter: CatmullRom
  anchor: Smart
  jpeg:
    quality: 75
  webp:
    quality: 75
  avif:
    quality: 75

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false
    style: tango

outputs:
  home: [HTML, RSS, markdown, LLMS, NAVJSON]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

params:
  description: Apache HugeGraph is a full-stack graph database ecosystem for OLTP, OLAP, and graph AI.
  github_repo: https://github.com/apache/hugegraph-doc
  github_project_repo: https://github.com/apache/hugegraph
  github_branch: master
  logo: img/logo.svg
  version: latest
  # Historical entries are enabled only after the aggregate artifact exists.
  version_menu_pagelinks: false
  archived_version: false
  url_latest_version: https://hugegraph.apache.org/docs/
  offline_search: true
  offline_search_on_serve: true
  offline_search_index: summary
  offline_search_summary_length: 70
  offline_search_max_results: 10
  footer_center_info: ''
  # The compact ASF footer owns the legal line; global controls stay in header.
  copyright: false
  print:
    toc: true
  ui:
    dark_mode:
      enable: true
      show_menu: true
    footer_style: fat
    section_index: cards
    blog_index: cards
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_expand_levels: 2
    sidebar_icon_policy: groups
    sidebar_item_overflow: wrap
    page_context_menu:
      enable: true
      assistant_links: false
    reading_time: false
    feedback: false
    keyboard_nav: true

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.160.1
